      <text x="52" y="16" class="font-mono" font-size="11" font-weight="600" fill="#E2E8F0">Python · XGBoost · LightGBM · Celery · Redis · Playwright</text>
      <text x="458" y="16" class="font-mono" font-size="11" font-weight="700" fill="#10B981">PRODUCTION →</text>
