        <text x="416" y="15" class="font-mono" font-size="9" font-weight="700" fill="#34D399">T-55m +EV Alert</text>
      </g>

      <!-- Bottom: Probability Curve vs Bookmaker Threshold -->
      <g transform="translate(16, 48)">
        <!-- Area Chart for P_bot -->
        <path d="M 0,72 Q 60,70 110,45 Q 160,12 210,12 Q 260,12 310,45 Q 360,70 410,72 L 410,74 L 0,74 Z" fill="url(#evFill)"/>
        <path d="M 0,72 Q 60,70 110,45 Q 160,12 210,12 Q 260,12 310,45 Q 360,70 410,72" fill="none" stroke="#10B981" stroke-width="2"/>

        <!-- Bookmaker Implied Threshold Line -->
        <line x1="145" y1="4" x2="145" y2="74" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="12" y="24" class="font-mono" font-size="9.5" fill="#F59E0B">Cuota Bookie: 52.4%</text>

        <!-- Model Peak -->
        <line x1="210" y1="12" x2="210" y2="74" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2 2"/>
        <circle cx="210" cy="12" r="4" fill="#10B981"/>
        <text x="220" y="20" class="font-mono" font-size="10" font-weight="700" fill="#34D399">P_bot: 61.8% (+9.4% EV)</text>

        <!-- Formula Box on Right -->
        <rect x="368" y="8" width="136" height="60" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <text x="378" y="25" class="font-mono" font-size="9" fill="#94A3B8">CRITERIO DE DISPARO:</text>
        <text x="378" y="43" class="font-mono" font-size="10" font-weight="700" fill="#F8FAFC">(1/P_bot)*(1+α) &lt; Q</text>
        <text x="378" y="59" class="font-mono" font-size="9.5" fill="#10B981">α = 0.05 · EDGE OK</text>
      </g>
    </g>

    <!-- Footer Stack Tags -->
    <g transform="translate(24, 224)">
