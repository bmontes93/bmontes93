<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <linearGradient id="evFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="cyanFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }

    @keyframes sliderCompare {
      0%, 100% { transform: translateX(-28px); }
      50% { transform: translateX(28px); }
    }

    @keyframes clusterGlow {
      0%, 100% { opacity: 0.25; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1); }
    }

    @keyframes rtpDraw {
      0% { stroke-dashoffset: 260; }
      50%, 100% { stroke-dashoffset: 0; }
    }

    @keyframes cubePulse {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
    }

    @keyframes stagePulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .compare-bar {
      animation: sliderCompare 3.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .cluster-win {
      transform-box: fill-box;
      transform-origin: center;
      animation: clusterGlow 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .rtp-curve {
      stroke-dasharray: 260;
      animation: rtpDraw 4.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .mesh-3d {
      transform-box: fill-box;
      transform-origin: center;
      animation: cubePulse 3.2s ease-in-out infinite;
    }

    .active-stage {
      animation: stagePulse 2s ease-in-out infinite;
    }
  </style>

  <!-- ==================== CARD 1: EXON-FACE (TOP LEFT) ==================== -->
  <g transform="translate(8, 8)">
    <rect width="584" height="264" rx="12" fill="url(#bentoBg)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="24" y="0" width="140" height="2" fill="#38BDF8"/>

    <!-- Header -->
    <text x="24" y="34" class="font-sans" font-size="20" font-weight="800" fill="#F8FAFC" letter-spacing="-0.4">EXON-FACE</text>
    <rect x="150" y="18" width="136" height="20" rx="4" fill="#0C4A6E" fill-opacity="0.6" stroke="#0284C7" stroke-width="0.8"/>
    <text x="160" y="32" class="font-mono" font-size="10" font-weight="600" fill="#38BDF8">COMPUTER VISION · FP16</text>

    <text x="24" y="58" class="font-sans" font-size="12.5" fill="#94A3B8">
      Segmentación facial a nivel de píxel (BiSeNet) y restauración generativa (CodeFormer/GFPGAN).
    </text>

    <!-- Live Interactive Visual Simulation Box -->
    <g transform="translate(24, 72)">
      <rect width="536" height="134" rx="8" fill="#070A10" stroke="#1E293B" stroke-width="1"/>

      <!-- Left: Split Pass Comparison -->
      <g transform="translate(14, 12)">
        <rect width="186" height="110" rx="6" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
        <text x="10" y="16" class="font-mono" font-size="9" fill="#64748B">RAW INPUT</text>
        <text x="112" y="16" class="font-mono" font-size="9" fill="#38BDF8">FP16 RESTORED</text>

        <!-- Wireframe Face Silhouette inside Viewport -->
        <g transform="translate(93, 62)">
          <ellipse cx="0" cy="0" rx="26" ry="34" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 2"/>
          <polygon points="0,-32 22,-22 26,4 16,26 0,34 -16,26 -26,4 -22,-22" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="1.2"/>
          <circle cx="-10" cy="-6" r="3" fill="#10B981"/>
          <circle cx="10" cy="-6" r="3" fill="#10B981"/>
          <path d="M -9,14 Q 0,20 9,14" fill="none" stroke="#818CF8" stroke-width="1.5"/>
        </g>

        <!-- Animated Split Wipe Line -->
        <g class="compare-bar">
          <line x1="93" y1="8" x2="93" y2="104" stroke="#38BDF8" stroke-width="1.5"/>
          <circle cx="93" cy="56" r="6" fill="#0B0F19" stroke="#38BDF8" stroke-width="1.5"/>
        </g>
      </g>

      <!-- Right: Tensor Layer Telemetry -->
      <g transform="translate(216, 14)">
        <text x="0" y="12" class="font-mono" font-size="10" font-weight="700" fill="#E2E8F0">TENSOR PIPELINE TELEMETRY (NVIDIA CUDA)</text>

        <!-- Layer 1 -->
        <text x="0" y="34" class="font-mono" font-size="10" fill="#94A3B8">1. BiSeNet Semantic Mask</text>
        <text x="250" y="34" class="font-mono" font-size="10" font-weight="700" fill="#38BDF8">3.2 ms (99.4%)</text>
        <rect x="0" y="40" width="304" height="5" rx="2.5" fill="#1E293B"/>
        <rect x="0" y="40" width="292" height="5" rx="2.5" fill="#38BDF8"/>

        <!-- Layer 2 -->
        <text x="0" y="64" class="font-mono" font-size="10" fill="#94A3B8">2. InsightFace 68-Landmark Warp</text>
        <text x="250" y="64" class="font-mono" font-size="10" font-weight="700" fill="#818CF8">2.1 ms (FP16)</text>
        <rect x="0" y="70" width="304" height="5" rx="2.5" fill="#1E293B"/>
        <rect x="0" y="70" width="276" height="5" rx="2.5" fill="#818CF8"/>

        <!-- Layer 3 -->
        <text x="0" y="94" class="font-mono" font-size="10" fill="#94A3B8">3. CodeFormer + GFPGAN Blend</text>
        <text x="250" y="94" class="font-mono" font-size="10" font-weight="700" fill="#10B981">6.1 ms (60 FPS)</text>
        <rect x="0" y="100" width="304" height="5" rx="2.5" fill="#1E293B"/>
        <rect x="0" y="100" width="298" height="5" rx="2.5" fill="#10B981"/>
      </g>
    </g>

    <!-- Footer Stack Tags -->
    <g transform="translate(24, 224)">
      <text x="0" y="16" class="font-mono" font-size="11" fill="#64748B">STACK:</text>
      <text x="52" y="16" class="font-mono" font-size="11" font-weight="600" fill="#E2E8F0">Python · ONNX Runtime · CUDA FP16 · OpenCV · BiSeNet · Docker</text>
      <text x="468" y="16" class="font-mono" font-size="11" font-weight="700" fill="#38BDF8">PUBLIC REPO →</text>
    </g>
  </g>

  <!-- ==================== CARD 2: MOTOR PREDICTIVO ML (TOP RIGHT) ==================== -->
  <g transform="translate(608, 8)">
    <rect width="584" height="264" height-rx="12" rx="12" fill="url(#bentoBg)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="24" y="0" width="140" height="2" fill="#10B981"/>

    <!-- Header -->
    <text x="24" y="34" class="font-sans" font-size="20" font-weight="800" fill="#F8FAFC" letter-spacing="-0.4">Motor Predictivo ML &amp; Value-Betting</text>
